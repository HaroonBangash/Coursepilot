name: coursepilot

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Published to localhost only. The proxy below, or an existing one, serves the public site.
    ports:
      - "127.0.0.1:${APP_PORT:-3100}:3000"
    volumes:
      - coursepilot-data:/app/data
      - coursepilot-storage:/app/storage
    # Limits protect anything else running on a shared server.
    mem_limit: 6g
    cpus: 2

  # Optional: only for a server with nothing already using ports 80 and 443.
  # Start with: docker compose -f deploy/docker-compose.yml --profile proxy up -d
  proxy:
    image: caddy:2.10.2-alpine
    profiles: [proxy]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  coursepilot-data:
  coursepilot-storage:
  caddy-data:
  caddy-config:
